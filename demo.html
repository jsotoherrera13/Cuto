<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuto | Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f2;color:#181827;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;min-height:100vh;display:grid;grid-template-columns:1fr 390px;align-items:center;gap:70px;padding:40px 24px}h1{font-size:76px;letter-spacing:-6px;margin:0}h1 span{color:#6746d7}h2{font-size:24px;margin:12px 0}p{line-height:1.5;color:#676474}aside h2{color:#6746d7;font-size:30px}aside a{color:#6746d7}.phone{background:white;border:1px solid #ded9e8;border-radius:32px;padding:24px;min-height:650px;box-shadow:0 18px 65px #33225c19;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:14px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #e3deeb;background:white;border-radius:12px;padding:12px;color:inherit}button:disabled{opacity:.45;cursor:default}.primary{background:#603ed0;color:white;border:0;width:100%;font-weight:700;margin-top:16px}.card{border:1px solid #e9e5ed;background:#faf9f7;border-radius:14px;padding:14px;margin:12px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.muted{color:#777;font-size:13px}.center{text-align:center}.qr{background:#252329;border-radius:24px;padding:35px 20px;margin:22px 0;color:white}.qr b{display:block;font-size:55px}.qr span{font-size:75px}.choices{display:grid;gap:8px}.choice{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #e6e0ed;border-radius:12px}input[type=radio],input[type=checkbox]{accent-color:#603ed0}input[type=number],textarea,select{width:100%;padding:10px;border:1px solid #d9d4e1;border-radius:9px;background:white}.big{font-size:32px;font-weight:800}.success{background:#603ed0;color:white;border-radius:50%;width:90px;height:90px;display:grid;place-items:center;font-size:50px;margin:40px auto 20px}.progress{height:6px;background:#eee;border-radius:10px;margin:15px 0}.progress i{display:block;background:#6746d7;height:100%;border-radius:10px}.foot{margin-top:auto;padding-top:18px;text-align:center;color:#777;font-size:12px}.emoji{font-size:26px} @media(max-width:700px){main{display:block;padding:16px;max-width:440px}aside{margin-bottom:18px}aside h1{font-size:40px;letter-spacing:-2px}aside h2{font-size:20px;margin:3px 0}aside .desc{display:none}.phone{min-height:580px;padding:18px;border-radius:24px}} input[type=email]{width:100%;padding:12px;border:1px solid #d9d4e1;border-radius:10px;margin-top:6px}.stars{display:flex;justify-content:center;gap:5px}.stars button{font-size:32px;color:#cbc5d4;border:0;padding:5px;background:transparent}.stars button[aria-pressed=true]{color:#e9a31b}.stars button:focus-visible{outline:2px solid #603ed0} @media print{aside,header,.progress,.foot,button{display:none!important}main{display:block;padding:0}.phone{box-shadow:none;border:0;min-height:0;max-width:450px;margin:auto}body{background:white}} </style></head><body><main><aside><h1>Cut<span>o</span></h1><h2>Pide. Paga. Divide.<br>Así de simple.</h2><div class="desc"><p>Escanea el QR de tu mesa, revisa tu orden y paga tu parte como prefieras.</p><p>▣ &nbsp; Escanea el QR<br>☷ &nbsp; Visualiza tu orden<br>◉ &nbsp; Divide la cuenta<br>▤ &nbsp; Elige cómo pagar</p></div><p><a href="index.html">Volver al sitio principal</a></p></aside><section class="phone"><header><button id="back" aria-label="Volver">‹</button><strong id="title"></strong><small>DEMO</small></header><div class="progress"><i id="progress"></i></div><div id="screen"></div><div class="foot">Cuto · Prototipo interactivo · Sin cobros reales</div></section></main><script>
'use strict';
const money=n=>'$'+Math.round(n).toLocaleString('es-CL'), items=[['🍔','Hamburguesa clásica',11900],['🍔','Hamburguesa clásica',11900],['🍟','Papas trufadas',8900],['🍋','Limonada de menta',3900],['🍋','Limonada de menta',3900],['🍫','Brownie con helado',6900]], initialTotal=items.reduce((s,x)=>s+x[2],0);
let total=initialTotal, step=1,people=4,parts=1,mode='equal',tip=10,method='Tarjeta de crédito / débito',free=10000,paid=0,last=null,picks={},allocated=items.map(()=>0),history=[],rating=0;
const $=id=>document.getElementById(id), remaining=()=>total-paid;
function amount(){if(mode==='all')return remaining();if(mode==='free')return Math.min(remaining(),Math.max(0,Math.round(free)||0));if(mode==='mine')return Math.min(remaining(),Object.entries(picks).reduce((s,[i,p])=>s+Math.min(items[i][2]-allocated[i],Math.round(items[i][2]*p.take/p.of)),0));return Math.min(remaining(),Math.round(remaining()*parts/people))}
const tipAmount=()=>Math.round(amount()*tip/100);
function go(n){step=n;render()}function row(a,b){return '<div class="line"><span>'+a+'</span><strong>'+b+'</strong></div>'}function primary(label,n){return '<button class="primary" onclick="go('+n+')">'+label+'</button>'}
function render(){const titles=['Escanear','Mi orden · Mesa 12','Dividir cuenta','Pagar','Boleta y reseña','Comprobante','Evaluar servicio'];$('title').textContent=titles[step];$('back').disabled=step<=1||step>=4;$('progress').style.width=(Math.min(step,4)/4*100)+'%';let h='';
if(step===0)h='<div class="center"><h2>Escanea el QR</h2><p>de tu mesa para comenzar</p><div class="qr">Mesa<b>12</b><span>▦</span><p style="color:white">Código de demostración</p></div>'+primary('Simular escaneo de mesa 12',1)+'<p class="muted">No se requiere cámara para esta demo.</p></div>';
if(step===1){h='<h2>Tu orden</h2><p class="muted">Mesa 12 · Orden en vivo (simulada)</p>'+items.map((x,i)=>row('<span class="emoji">'+x[0]+'</span> '+x[1]+(allocated[i]?' <small> · Abonado '+money(allocated[i])+'</small>':''),money(x[2]))).join('')+'<button onclick="addDish()" style="width:100%;margin-top:12px">+ Simular nuevo consumo</button><div class="card">'+row('Total cuenta',money(total))+row('Pagado',money(paid))+row('Saldo pendiente',money(remaining()))+'</div>'+(remaining()?primary('Continuar',2):'<p>Cuenta pagada completamente.</p>')+'<button style="width:100%;margin-top:8px" onclick="reset()">Reiniciar demo</button>'}
if(step===2){h='<div class="card">'+row('Saldo pendiente',money(remaining()))+'</div><h2>¿Cómo quieres dividir?</h2><div class="choices">'+[['equal','En partes iguales'],['free','Monto libre'],['mine','Personalizado · elige y fracciona platos'],['all','Invitar · pagar todo']].map(([v,l])=>'<label class="choice"><input type="radio" name="mode" '+(mode===v?'checked':'')+' onchange="mode=\''+v+'\';render()">'+l+'</label>').join('')+'</div>';
if(mode==='equal')h+='<div class="line">Personas <div><button onclick="people=Math.max(1,people-1);parts=Math.min(parts,people);render()">−</button> <b>'+people+'</b> <button onclick="people=Math.min(20,people+1);render()">+</button></div></div><div class="line">Partes que asumes <div><button onclick="parts=Math.max(1,parts-1);render()">−</button> '+parts+' <button onclick="parts=Math.min(people,parts+1);render()">+</button></div></div>';
if(mode==='free')h+='<p>Monto en pesos</p><input type="number" min="1" max="'+remaining()+'" value="'+free+'" oninput="free=Number(this.value);refreshAmount()">';
if(mode==='mine')h+=items.map((x,i)=>{let p=picks[i];return '<div class="card"><label><input type="checkbox" '+(p?'checked':'')+' '+(allocated[i]>=x[2]?'disabled':'')+' onchange="pick('+i+',this.checked)"> '+x[0]+' '+x[1]+' · '+money(x[2]-allocated[i])+'</label>'+(p?'<div class="line">Fracciones totales <select aria-label="Fracciones totales" onchange="picks['+i+'].of=Number(this.value);picks['+i+'].take=1;render()">'+Array.from({length:8},(_,k)=>'<option '+(p.of===k+1?'selected':'')+'>'+(k+1)+'</option>').join('')+'</select></div><div class="line">Mis fracciones <select aria-label="Mis fracciones" onchange="picks['+i+'].take=Number(this.value);render()">'+Array.from({length:p.of},(_,k)=>'<option '+(p.take===k+1?'selected':'')+'>'+(k+1)+'</option>').join('')+'</select></div>':'')+'</div>'}).join('');
h+='<div class="line">Tu parte <strong id="amt">'+money(amount())+'</strong></div><button id="next" class="primary" '+(!amount()?'disabled':'')+' onclick="go(3)">Continuar</button>'}
if(step===3){h='<div class="card">'+row('Tu parte a pagar',money(amount()))+'</div><h2>Propina sugerida</h2><div class="choices" style="grid-template-columns:repeat(4,1fr)">'+[0,10,15,20].map(t=>'<button style="'+(tip===t?'background:#eee7ff;border-color:#6746d7':'')+'" onclick="tip='+t+';render()">'+t+'%</button>').join('')+'</div><h2>Medios de pago</h2>'+['Tarjeta de crédito / débito','Apple Pay','Google Pay','Mercado Pago','Efectivo'].map((m,i)=>'<label class="choice"><input type="radio" name="pay" '+(method===m?'checked':'')+' onchange="method=this.value" value="'+m+'">'+['💳','◉','◉','◈','▤'][i]+' '+m+'</label>').join('')+'<div class="line">Total con propina <strong>'+money(amount()+tipAmount())+'</strong></div><button class="primary" onclick="pay()" '+(!amount()?'disabled':'')+'>Simular pago '+money(amount()+tipAmount())+'</button>'}
if(step===4)h='<div class="center"><div class="success" style="margin:12px auto;width:64px;height:64px;font-size:36px">✓</div><h2>¡Pago realizado!</h2><div class="big">'+money(last.base+last.tip)+'</div><p class="muted">Pago de demostración · Mesa 12</p></div><form id="receipt" onsubmit="sendReceipt(event)"><h2>Recibe tu boleta</h2><label for="email">Correo electrónico</label><input id="email" type="email" required placeholder="nombre@correo.cl" autocomplete="email"><button class="primary" type="submit">Enviar boleta</button><p id="emailStatus" role="status" class="muted"></p></form><div style="border-top:1px solid #eee;margin-top:20px;padding-top:10px"><h2>¿Cómo estuvo tu visita?</h2><p class="muted">Califica tu experiencia y comparte tu opinión en Google.</p><div class="stars" role="group" aria-label="Calificación de 1 a 5 estrellas">'+[1,2,3,4,5].map(n=>'<button type="button" aria-label="'+n+' estrellas" aria-pressed="false" onclick="setRating('+n+')">★</button>').join('')+'</div><p id="ratingStatus" class="muted" role="status">Selecciona una calificación</p><label for="review">Tu reseña</label><textarea id="review" rows="3" placeholder="Cuéntanos cómo fue tu experiencia..."></textarea><button class="primary" onclick="googleReview()">Continuar en Google</button><p id="reviewStatus" class="muted" role="status">Google requiere confirmar y publicar la reseña desde tu cuenta. Falta configurar la ficha del restaurante.</p></div>'+'<button style="width:100%;margin-top:10px" onclick="go(5)">Ver comprobante descargable</button>'+primary('Volver a mi orden',1);
if(step===5)h='<div class="center"><p style="color:#17734c">✓ Pago simulado exitoso</p><div class="big">'+money(last.base+last.tip)+'</div><p>Comprobante de demostración · No es boleta tributaria</p></div><div class="card">'+row('Mesa','12')+row('Fecha',last.date)+row('Medio',last.method)+row('Tu parte',money(last.base))+row('Propina',money(last.tip))+row('Saldo mesa',money(remaining()))+'</div><div class="center"><h2>Cuto</h2><p>Gracias por tu visita 💜</p></div>'+primary('Volver a boleta y reseña',4)+'<button class="primary" onclick="window.print()">Guardar PDF / imprimir</button>'+primary('Volver a la mesa',1);
if(step===6)h='<h2>¿Cómo estuvo tu visita?</h2><p>Garzón de ejemplo: Martín</p><label>Evaluación<select id="rating"><option>5 — Excelente</option><option>4 — Muy buena</option><option>3 — Buena</option><option>2 — Regular</option><option>1 — Mala</option></select></label><p>Comentario opcional</p><textarea id="comment" rows="4"></textarea><button class="primary" onclick="this.disabled=true;this.textContent=\'Evaluación registrada en la demo\'">Enviar evaluación</button>'+primary('Volver a la mesa',1);
$('screen').innerHTML=h;saveState()}
function refreshAmount(){$('amt').textContent=money(amount());$('next').disabled=!amount()}
function pick(i,on){if(on)picks[i]={of:1,take:1};else delete picks[i];render()}
function pay(){const base=amount();if(step!==3||!base)return;last={base,tip:tipAmount(),method,date:new Date().toLocaleDateString('es-CL')};let left=base;if(mode==='mine')for(const [i,p] of Object.entries(picks)){let v=Math.min(left,items[i][2]-allocated[i],Math.round(items[i][2]*p.take/p.of));allocated[i]+=v;left-=v}for(let i=0;i<items.length&&left>0;i++){let v=Math.min(left,items[i][2]-allocated[i]);allocated[i]+=v;left-=v}paid+=base;history.push(last);picks={};rating=0;go(4)}
function reset(){if(!confirm('¿Reiniciar todos los consumos y pagos de esta demo?'))return;items.splice(6);total=initialTotal;rating=0;paid=0;allocated=items.map(()=>0);history=[];picks={};last=null;mode='equal';people=4;parts=1;tip=10;go(1)}
function addDish(){items.push(['☕','Café espresso',2500]);allocated.push(0);total+=2500;render()}
function saveState(){try{localStorage.setItem('cuto-demo-table12',JSON.stringify({items,allocated,paid,history,last}))}catch(e){}} function loadState(){try{const s=JSON.parse(localStorage.getItem('cuto-demo-table12'));if(!s||!Array.isArray(s.items)||!Array.isArray(s.allocated)||s.items.length!==s.allocated.length)return;items.splice(0,items.length,...s.items);allocated=s.allocated;total=items.reduce((a,x)=>a+x[2],0);paid=allocated.reduce((a,x)=>a+x,0);history=s.history||[];last=s.last||null}catch(e){}} function setRating(n){rating=n;document.querySelectorAll('.stars button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i<n)));$('ratingStatus').textContent=n+' de 5 estrellas'}
function sendReceipt(e){e.preventDefault();$('emailStatus').textContent='Correo validado. En esta demo no se envían boletas reales.'}
const googleReviewUrl=''; // Configure with the restaurant's official Google review link.
async function googleReview(){if(!rating){$('reviewStatus').textContent='Selecciona primero una calificación.';return}if(!googleReviewUrl){$('reviewStatus').textContent='Reseña preparada. Falta configurar el enlace de reseñas de Google del restaurante.';return}try{await navigator.clipboard.writeText($('review').value);$('reviewStatus').textContent='Texto copiado. Selecciona tus estrellas y pega tu reseña en Google.'}catch(e){$('reviewStatus').textContent='Copia tu comentario manualmente antes de continuar.'}window.location.href=googleReviewUrl}
$('back').onclick=()=>go(step-1);loadState();render();
</script></body></html>
